# Banco de dados local para desenvolvimento e testes.
# A conta na nuvem (homologação em atelierizagusmao.com.br) é criada pelo André;
# este arquivo só sobe o PostgreSQL na sua máquina.
services:
  postgres:
    image: postgres:16-alpine
    container_name: anexsys-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-anexsys}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - anexsys-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-anexsys}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  anexsys-postgres-data:
